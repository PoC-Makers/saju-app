name: ✨ 기능
description: 새로 만들 기능이 있나요?
labels: ["✨ Feat"]
body:
  - type: textarea
    attributes:
      label: 📄 기능 설명
      description: 무엇을 만들고 왜 필요한지 적어주세요.
      placeholder: "예: 생년월일시를 입력하면 사주팔자 8글자를 보여주는 화면"
    validations:
      required: true

  - type: textarea
    attributes:
      label: ✅ 작업할 내용
      description: 구현에 필요한 작업을 체크리스트로 적어주세요.
      placeholder: |
        - [ ] 입력 폼 UI
        - [ ] core 계산 함수 연결
        - [ ] 결과 표시 컴포넌트
        - [ ] 테스트 추가
    validations:
      required: true

  - type: textarea
    attributes:
      label: 🔗 참고 자료
      description: 관련 문서·링크가 있으면 남겨주세요.
    validations:
      required: false
