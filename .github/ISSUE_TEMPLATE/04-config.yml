name: ⚙️ 환경설정
description: 개발 환경·도구·인프라 설정이 필요한가요?
labels: ["⚙️ Config"]
body:
  - type: markdown
    attributes:
      value: "CI 설정이면 `🔧 CI`, 의존성·빌드 설정이면 `📦 Build` 라벨로 조정해주세요."

  - type: textarea
    attributes:
      label: 🎯 작업 목표
      description: 무엇을 설정하고 왜 필요한지 적어주세요.
      placeholder: "예: mise로 Node 버전을 프로젝트에 고정해 팀·CI 환경을 일치시킨다"
    validations:
      required: true

  - type: textarea
    attributes:
      label: ✅ 작업할 내용
      placeholder: |
        - [ ] mise.toml 작성
        - [ ] README에 설치 안내 추가
    validations:
      required: true

  - type: textarea
    attributes:
      label: ⚠️ 영향 범위
      description: 다른 작업·환경에 영향이 있으면 적어주세요.
      placeholder: "예: 팀원 모두 mise 설치 필요, CI 워크플로 수정 동반"
    validations:
      required: false

  - type: textarea
    attributes:
      label: 🔗 참고 자료
    validations:
      required: false
